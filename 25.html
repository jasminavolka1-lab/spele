<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delfīnu peldēšana</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color: #edf5ff; color: #17212b; }
button { background-color: #245b91; color: white; border: 0; border-radius: 8px; }
</style>
</head>
<body>
<h1>Delfīnu peldēšana</h1>
<p>Delfīns peldē pāri korāļiem un vāc zvaigznes.</p>
<img src="attels/Untitled.png" alt="Zils delfīns" width="128">
<p>Uzvaras skaņa:</p>
<audio controls src="klikskis.wav"></audio>
<p id="punkti">Punkti: 0</p>
<button onclick="savakt()">Savākt zvaigznes</button>
<script>
// Gatava poga. Šajā tēmā mācies noformēt lapu un sakārtot failus.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
